name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch: # allows a manual "Run workflow" from the Actions tab

# Never run two deploys at once — a second push waits for the first to finish
concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

env:
  SSH_HOST: 147.93.100.104
  SSH_PORT: 65002
  SSH_USER: u168180064
  REMOTE_DIR: ~/domains/rajivwilliams.com/public_html

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the project
        run: npm run build

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          # Strip Windows CRLFs and guarantee a trailing newline — OpenSSH rejects
          # the key with "error in libcrypto" otherwise.
          printf '%s\n' "$HOSTINGER_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy-key
          chmod 600 ~/.ssh/deploy-key
          ssh-keygen -y -f ~/.ssh/deploy-key > /dev/null && echo "Key format OK"
          # Hostinger shared SSH often drops GitHub runners on the first scan.
          # Do not fail the job here — Verify SSH below is the real check.
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          for i in 1 2 3 4 5; do
            echo "ssh-keyscan attempt $i"
            if ssh-keyscan -T 30 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/tmp/keyscan.err; then
              echo "Host key saved"
              break
            fi
            cat /tmp/keyscan.err || true
            sleep 8
          done
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}

      - name: Verify SSH connection
        run: |
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 \
            -i ~/.ssh/deploy-key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'echo "SSH connection works"'

      # Same as the manual deploy: scp only adds/overwrites files, never deletes
      # anything already in public_html (.htaccess, manual uploads stay intact).
      - name: Upload build to Hostinger
        run: |
          scp -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 \
            -i ~/.ssh/deploy-key -P "$SSH_PORT" -r dist/* "$SSH_USER@$SSH_HOST:$REMOTE_DIR/"

      # Same permission fix used manually to resolve the font loading issue
      - name: Fix file permissions
        run: |
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 \
            -i ~/.ssh/deploy-key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "cd $REMOTE_DIR && chmod 755 assets fonts && chmod 644 assets/* fonts/* index.html robots.txt sitemap.xml"
